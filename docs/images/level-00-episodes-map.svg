<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title description">
  <title id="title">Level 00 Foundry Core: episodes mapped on lanes a, b and c - draft</title>
  <desc id="description">Level 00 has eleven episodes. Lane 00a has seven: Foundry Core, Chat Completions, Model Benchmark, Model Fine-Tuning, Model Monitoring, Managed Compute and Public Gateway. Lane 00b has no episode yet. Lane 00c has four: Foundry Core BYO VNet, Chat Completions, Token Governance and Usage Attribution. The first episode of a lane deploys the lane; the others add a client, an opt-in profile or a gateway policy on top of it. The 00a Public Gateway reuses the shared APIM policy module of 00c.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #036958; }
      .label { font-size: 19px; font-weight: 600; }
      .muted { fill: #52647a; }
      .small { font-size: 16px; }
      .sub { font-size: 15px; fill: #52647a; }
      .mono { font-family: Consolas, "Liberation Mono", monospace; }
      .num { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .pill { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; fill: #fff; }
      .status { font-size: 13px; font-weight: 600; fill: #52647a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6d62b5"/>
    </marker>
  </defs>

  <rect width="1440" height="1250" fill="#f4f7fb"/>
  <path d="M0 0H1440V8H0Z" fill="#087f72"/>
  <text x="40" y="49" class="eyebrow">MICROSOFT FOUNDRY NOTES / LEVEL 00</text>
  <text x="40" y="99" font-size="43" font-weight="700">Foundry Core: episodes on lanes</text>
  <text x="40" y="134" font-size="20" class="muted">11 episodes. The first of each lane deploys it; the others run on top of it.</text>
  <rect x="1171" y="38" width="229" height="33" rx="16" fill="#fff1cd" stroke="#dcc27f"/>
  <text x="1285" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">EPISODE PLAN</text>

  <!-- lane headers -->
  <g transform="translate(40 165)">
    <rect width="440" height="80" rx="12" fill="#fff" stroke="#cddfe9"/>
    <rect width="6" height="80" rx="3" fill="#167ba8"/>
    <text x="23" y="33" class="label"><tspan class="mono">00a</tspan> / Public</text>
    <text x="23" y="59" class="small muted">Entra ID authenticated; 7 episodes</text>
  </g>
  <g transform="translate(500 165)">
    <rect width="440" height="80" rx="12" fill="#fff" stroke="#cddfe9"/>
    <rect width="6" height="80" rx="3" fill="#6d62b5"/>
    <text x="23" y="33" class="label"><tspan class="mono">00b</tspan> / Foundry Managed VNet</text>
    <text x="23" y="59" class="small muted">Private ingress, managed outbound; 0 episodes</text>
  </g>
  <g transform="translate(960 165)">
    <rect width="440" height="80" rx="12" fill="#fff" stroke="#cddfe9"/>
    <rect width="6" height="80" rx="3" fill="#087f72"/>
    <text x="23" y="33" class="label"><tspan class="mono">00c</tspan> / BYO VNet</text>
    <text x="23" y="59" class="small muted">Private Foundry behind APIM; 4 episodes</text>
  </g>

  <!-- lane spines -->
  <path d="M70 304V976" stroke="#9fc4d8" stroke-width="3"/>
  <path d="M990 304V640" stroke="#8cc9bd" stroke-width="3"/>

  <!-- lane b placeholder -->
  <g transform="translate(500 270)">
    <rect width="440" height="100" rx="10" fill="#fafaff" stroke="#a79fd6" stroke-dasharray="6 4"/>
    <text x="220" y="42" text-anchor="middle" class="label" fill="#6d62b5" style="fill:#6d62b5">No episode yet</text>
    <text x="220" y="68" text-anchor="middle" class="sub">00b is not part of this repository yet.</text>
  </g>

  <!-- lane a episodes -->
  <g transform="translate(40 270)">
    <rect width="440" height="100" rx="10" fill="#e2f5eb" stroke="#90cbb0"/>
    <circle cx="30" cy="34" r="15" fill="#167ba8"/><text x="30" y="40" class="num">1</text>
    <text x="60" y="40" class="label">Foundry Core</text>
    <text x="60" y="62" class="sub">Account, project and one model</text>
    <rect x="60" y="72" width="56" height="22" rx="11" fill="#087f72"/><text x="88" y="87" class="pill">INFRA</text>
    <text x="128" y="88" class="status">Published on LinkedIn</text>
